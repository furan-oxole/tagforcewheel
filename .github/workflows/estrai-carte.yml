
name: Estrai immagini carte

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  estrai:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Estrai le immagini
        run: |
          set -e
          shopt -s nullglob
          for zip in archivi/*.zip; do
            numero=$(basename "$zip" .zip)

            if [[ ! "$numero" =~ ^[1-9]$ ]]; then
              echo "Archivio non riconosciuto: $zip"
              exit 1
            fi

            mkdir -p "Carte/$numero"

            unzip -tq "$zip"
            unzip -j -o "$zip" '*.webp' -d "Carte/$numero"

            if ! find "Carte/$numero" -name '*.webp' -print -quit | grep -q .; then
              echo "Nessuna immagine trovata in $zip"
              exit 1
            fi
          done

      - name: Salva immagini su GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Carte/
          if ! git diff --cached --quiet; then
            git commit -m "Aggiungi immagini carte"
            git push
          fi
